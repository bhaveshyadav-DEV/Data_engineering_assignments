# This is a Declarative Automation Bundle definition for first_job_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: first_job_dab
  uuid: 3e71576d-6192-4fd5-a37c-ca75005d8d6e

include:
  - resources/*.yml

# artifacts:
#   python_artifact:
#     type: whl
#     build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0cc14214-f5e5.cloud.databricks.com
    variables:
      catalog: cyntexa_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-0cc14214-f5e5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bhaveshyadav@cyntexa.com to make sure we only have a single copy.
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cyntexa_dev
      schema: prod
    permissions:
      - service_principal_name: a4fa772c-a894-4a06-a8f4-2fe54ccf4e25
        level: CAN_MANAGE
      - user_name: bhaveshyadav@cyntexa.com
        level: CAN_MANAGE
